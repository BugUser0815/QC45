name: native-integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'native-integration/**'
      - 'deploy/qc45-integration/**'
      - '.github/workflows/native-integration.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        working-directory: native-integration
        run: mvn -B clean package
      - name: Verify Java 7 bytecode
        working-directory: native-integration
        run: |
          javap -verbose -classpath target/qc45-integration-0.1.0.jar \
            de.rothner.qc45.BootstrapListener | grep -F 'major version: 51'
      - name: Test deployment health verification
        run: python3 -m unittest discover -s deploy/qc45-integration/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: qc45-integration
          path: native-integration/target/qc45-integration-0.1.0.jar
